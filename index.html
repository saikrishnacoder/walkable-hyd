<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Walkable HYD — Hyderabad Walkability Explorer &amp; Pedestrian Issue Map</title>
    <meta
      name="description"
      content="Explore Hyderabad neighborhood walkability scores, street audits for tree canopy shade, footpaths, Metro access, and safety, and report pedestrian infrastructure issues across Hyderabad."
    />
    <meta name="robots" content="index, follow" />
    <meta name="theme-color" content="#181D23" />

    <!-- Open Graph / Social Crawlers -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Walkable HYD — Hyderabad Walkability Explorer &amp; Pedestrian Issue Map" />
    <meta
      property="og:description"
      content="Explore 10 audited Hyderabad neighborhoods, re-weight walkability scores by shade, footpaths, Metro reach, and safety, and report street hazards."
    />
    <meta property="og:locale" content="en_IN" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Walkable HYD — Hyderabad Walkability Explorer" />
    <meta
      name="twitter:description"
      content="Neighborhood walkability scores, street audits, and community pedestrian issue reporting for Hyderabad."
    />

    <!-- Structured Data for Search Crawlers -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Walkable HYD",
        "applicationCategory": "MapsApplication",
        "operatingSystem": "Web",
        "description": "Hyderabad neighborhood walkability score explorer, street-audit telemetry viewer, and community pedestrian infrastructure issue map.",
        "areaServed": {
          "@type": "City",
          "name": "Hyderabad",
          "addressCountry": "IN"
        }
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body class="bg-[#F7F5F0] text-[#181D23] antialiased">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
